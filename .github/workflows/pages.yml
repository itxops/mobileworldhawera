# Publishes the contents of public/ to GitHub Pages.
#
# This does nothing until Pages is switched on for the repo:
#   Settings → Pages → Build and deployment → Source → "GitHub Actions"
#
# Once enabled, the site goes live at
#   https://itxops.github.io/mobileworldhawera/
# on every push to main. Delete this file if you would rather not use Pages —
# it has no effect on the Firebase Hosting deploy.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site on the first run instead of failing when it
          # has never been switched on. Needs the repo's workflow permissions
          # to be read+write (Settings -> Actions -> General -> Workflow
          # permissions); otherwise enable Pages by hand under Settings -> Pages
          # and set Source to "GitHub Actions".
          enablement: true
      - name: Upload public/ as the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
